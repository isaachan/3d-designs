74600" font-size="14" text-anchor="middle" font-family="Hiragino Sans GB, sans-serif">L1–L4</text><text x="760" y="170" fill="#20323d" font-size="24" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">拆件对应</text><text x="760" y="210" fill="#415d70" font-size="16" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">R1–R4：每圈的四个升坡片</text><text x="760" y="240" fill="#415d70" font-size="16" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">第一圈 13–16 盘：浅蓝</text><text x="760" y="270" fill="#415d70" font-size="16" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">第二圈 17–20 盘：深蓝</text><text x="760" y="300" fill="#415d70" font-size="16" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">第三圈 21–24 盘：红色</text><text x="760" y="330" fill="#415d70" font-size="16" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">L1–L4：25–28 号盘</text><text x="760" y="360" fill="#415d70" font-size="16" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">07–12：二至四楼的平台半片</text><text x="760" y="390" fill="#415d70" font-size="16" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">29：29 个原柱段／封顶段</text><text x="760" y="420" fill="#415d70" font-size="16" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">30：托臂、定高底段与侧牌框</text><text x="760" y="450" fill="#415d70" font-size="16" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">31：定位销、圆垫、连接片</text><text x="760" y="480" fill="#415d70" font-size="16" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">32：背板；33：标牌与标签</text><text x="35" y="590" fill="#20323d" font-size="18" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">红色虚线：底座／层板拼缝；红点：每处两根 Ø3 × 10 定位销，孔 Ø3.3、单侧深 5.2。</text><text x="35" y="626" fill="#536674" font-size="17" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">底座 X 分界 200、410；Y 分界 110。道路及层板拼缝先干装，再胶粘；底座拼缝另加底侧连接片。</text><text x="35" y="660" fill="#536674" font-size="17" text-anchor="start" font-family="Hiragino Sans GB, sans-serif">L1–L4 采用公共轮廓示意；4F 前缘按最终 CAD／3MF 齐边收口。请结合装配说明查看叠装次序。</text></svg>