<svg xmlns="http://www.w3.org/2000/svg" width="560" height="515" viewBox="0 0 560 515" role="img" aria-labelledby="title desc">
  <title id="title">斜口盒与墙的侧视图</title>
  <desc id="desc">盒底下方的斜撑向前伸 90 毫米，背板沿墙下延 45 毫米。上、下胶区贴在同一平面。</desc>
